name: Vault audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run vault checks
        shell: bash
        run: |
          set +e
          bash wiki审计/check.sh --all | tee audit.log
          rc=${PIPESTATUS[0]}
          {
            echo '## Vault audit'
            echo ''
            echo '```text'
            cat audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Check wiki frontmatter
        shell: bash
        run: |
          set -u
          missing=0
          while IFS= read -r -d '' file; do
            for key in module tags difficulty last_reviewed; do
              if ! sed -n '1,/^---$/p' "$file" | grep -q "^${key}:"; then
                echo "Missing ${key}: ${file}"
                missing=1
              fi
            done
          done < <(find wiki -type f -name '*.md' ! -name '_MOC.md' -print0)
          exit "$missing"
      - name: Check project frontmatter
        shell: bash
        run: |
          set -u
          missing=0
          while IFS= read -r -d '' file; do
            for key in module type status tags last_reviewed; do
              if ! sed -n '1,/^---$/p' "$file" | grep -q "^${key}:"; then
                echo "Missing ${key}: ${file}"
                missing=1
              fi
            done
          done < <(find projects -type f -name '*.md' -print0)
          exit "$missing"
      - name: List Markdown files in this revision
        if: always()
        shell: bash
        run: |
          {
            echo '## Markdown inventory'
            echo ''
            echo 'Tracked Markdown files:'
            echo '```text'
            git ls-files '*.md' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
